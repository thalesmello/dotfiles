onboarding = false

# herdr configuration
# Place this file at ~/.config/herdr/config.toml

# Show first-run notification setup on startup.
# Missing also shows onboarding; set false after you've chosen.
# onboarding = true

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
name = "catppuccin"

# Follow host terminal light/dark appearance and switch Herdr UI themes.
# Existing manual behavior is unchanged unless this is true.
# auto_switch = false
# dark_name = "catppuccin"
# light_name = "catppuccin-latte"

# Override individual color tokens on top of the base theme.
# Accepts: hex (#rrggbb), named colors, rgb(r,g,b), or panel_bg = "reset"
# Herdr only ships catppuccin (mocha) and catppuccin-latte, so the Frappé
# palette is applied on top of the mocha base here.
[theme.custom]
panel_bg = "#303446"     # base
surface0 = "#414559"
surface1 = "#51576d"
surface_dim = "#292c3c"  # mantle
overlay0 = "#737994"
overlay1 = "#838ba7"
text = "#c6d0f5"
subtext0 = "#a5adce"
accent = "#ca9ee6"       # mauve
mauve = "#ca9ee6"
green = "#a6d189"
yellow = "#e5c890"
red = "#e78284"
blue = "#8caaee"
teal = "#81c8be"
peach = "#ef9f76"

[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL, then /bin/sh.
# tmux parity: `set -g default-command "fish"`
default_shell = "fish"

# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
# "auto" uses login shells on macOS and keeps the current behavior elsewhere.
# shell_mode = "auto"

# CWD policy for new panes, tabs, and workspaces when no explicit --cwd is provided.
# Use "follow" to inherit the source pane/workspace, "home" for $HOME,
# "current" for Herdr's process directory, or a fixed path such as "~/Projects".
# new_cwd = "follow"

[update]
# Update channel used by background version checks and `herdr update`.
# Stable builds default to "stable". Windows preview builds default to "preview"
# so existing preview installs stay there until explicitly switched.
# channel = "stable"

# Check herdr.dev for new Herdr versions in the background.
# version_check = true

# Check herdr.dev for remote agent-detection manifest updates in the background.
# manifest_check = true

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# tmux parity: `set -g prefix C-Space`
prefix = "ctrl+space"

# Prefix-mode actions
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
reload_config = "prefix+shift+r"
# prefix+o is repurposed as the output picker (see [[keys.command]] below), so
# the notification-target jump is unbound.
open_notification_target = "prefix+shift+o"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# prefix+tab / prefix+shift+tab are taken over by attention-jump.fish and
# focus-back.fish (see [[keys.command]] below), so workspace nav is unbound here.
# It still lives on prefix+alt+1..9 / ctrl+alt+1..9 (switch_workspace) and on
# prefix+ctrl+n/p, which spill into the neighbouring workspace at either end.
previous_workspace = "prefix+ctrl+p"
next_workspace = "prefix+ctrl+n"
previous_agent = "prefix+ctrl+comma"
next_agent = "prefix+ctrl+period"
focus_agent = "prefix+shift+1..9"   # focus agent 1-9
# remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
# prefix+c / prefix+shift+c are repurposed to launch Claude Code (see
# [[keys.command]] below): prefix+c opens a 40%-width vertical split, and
# prefix+shift+c opens a whole new tab. Plain new-tab lives on prefix+ctrl+t.
# ctrl+alt+t is a direct (prefix-less) chord forwarded by Ghostty for cmd+t,
# mirroring new_tab without the prefix-timeout delay.
new_tab = ["prefix+ctrl+t", "ctrl+alt+t"]
# ctrl+alt+n is the direct chord for cmd+n; like prefix+shift+n it makes a new
# workspace (Ghostty's cmd+n = new_window), not a tab.
new_workspace = ["prefix+shift+n", "ctrl+alt+n"]
# rename_tab = "prefix+shift+t"
# prefix+ctrl+p/n are smart-tab-nav.sh (see [[keys.command]] below): tab-wise, but
# spilling into the neighbouring workspace at either end. prefix+ctrl+[/] stay as
# plain within-workspace tab nav.
previous_tab = ["prefix+ctrl+["]
next_tab = ["prefix+ctrl+]"]
# move_tab_previous = ""   # optional, e.g. "alt+shift+left" moves the tab toward the front
# move_tab_next = ""       # optional, e.g. "alt+shift+right" moves the tab toward the back
# switch_tab = "prefix+1..9"
# prefix+shift+1..9 focuses agents (focus_agent), so workspace focus lives on the
# alt variants: prefix+alt+1..9, plus the direct chord ctrl+alt+1..9 that Ghostty
# forwards for cmd+1..9 (mirrors nvim's Ngt on the same chord).
switch_workspace = ["prefix+alt+1..9", "ctrl+alt+1..9"]
close_tab = "prefix+shift+backspace"
close_pane = "prefix+ctrl+backspace"
# rename_pane = "prefix+shift+p"
edit_scrollback = ["prefix+shift+v", "prefix+e"]
# tmux parity: `bind Space copy-mode` (herdr default is prefix+[)
copy_mode = ["prefix+space"]
# plain prefix+h/j/k/l = herdr's native pane focus.
# prefix+ctrl+h/j/k/l is handled by smart-pane-nav.sh (see [[keys.command]] below):
# it focuses panes too, but forwards ctrl+hjkl to (n)vim when zoomed / single pane.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
# freed for next_agent / previous_agent (prefix+tab / prefix+shift+tab)
cycle_pane_next = ""
cycle_pane_previous = ""
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# tmux parity: `bind v` (side-by-side / vertical divider)
# prefix+% (prefix+shift+5) intentionally dropped: it collided with focus_agent 5.
# ctrl+alt+d is a direct chord forwarded by Ghostty for cmd+d (no prefix delay).
split_vertical = ["prefix+v", "ctrl+alt+d"]
# tmux parity: `bind '"' split-window -v` (stacked / horizontal divider)
# ctrl+alt+shift+d is a direct chord forwarded by Ghostty for cmd+shift+d.
split_horizontal = ["prefix+minus", "prefix+\"", "ctrl+alt+shift+d"]
# prefix+backspace is repurposed as smart-close (see [[keys.command]] below);
# plain tab close lives on prefix+shift+backspace, pane close on prefix+ctrl+backspace.
# prefix+ctrl+enter is also what Hammerspoon sends for cmd+shift+enter in a
# herdr window (see zoomWithFallback in dot-hammerspoon/ghosttyPreset.lua).
zoom = ["prefix+z", "prefix+ctrl+enter"]
resize_mode = [ "prefix+r"]
# resize_pane_left = ""   # optional, e.g. "ctrl+shift+alt+left" resizes without entering resize mode
# resize_pane_down = ""   # optional, e.g. "ctrl+shift+alt+down"
# resize_pane_up = ""     # optional, e.g. "ctrl+shift+alt+up"
# resize_pane_right = ""  # optional, e.g. "ctrl+shift+alt+right"
# ctrl+alt+b is the direct (prefix-less) chord, same toggle as prefix+b without
# the prefix-timeout delay.
toggle_sidebar = ["prefix+b", "ctrl+alt+b"]

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
# j/k (plus arrows) move up/down the sidebar workspace list in navigate mode
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
# h/j/k/l are freed here so navigate mode only moves the sidebar (j/k above);
# pane focus stays on prefix+h/j/k/l. Arrow keys still move pane left/right.
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
# Popup width and height accept terminal cells or percentages such as "80%".
# On Windows, command strings run through cmd.exe /d /c.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# width = "80%"
# height = "80%"

# tmux parity: `bind C send-keys C-l` — clear the focused pane's screen.
# (tmux also ran `clear-history`; herdr has no scrollback-clear CLI, so this
#  only sends ctrl+l, same as pressing it directly in the shell.)
[[keys.command]]
key = "prefix+ctrl+c"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "clear screen (ctrl+l)"

# prefix+ctrl+r: put THIS pane back into the conversation its agent was in,
# after the agent died in it. Resolves the conversation by pane (see
# `herdr-preset resume-agent`, and the agent-sessions plugin in local-plugins
# that records them), so it picks the right one where `claude --continue` --
# most recent for the cwd -- does not. The `resume-agent` shim is what turns a
# failure into a notification: a detached type = "shell" command has no
# terminal, so "an agent is still running here" would otherwise be a keypress
# that appears to do nothing.
[[keys.command]]
key = "prefix+ctrl+r"
type = "shell"
command = "resume-agent"
description = "resume this pane's dead agent"

# prefix+=: even out every split in the tab, so all panes end up the same size
# (tmux parity: `select-layout even-horizontal` / `even-vertical`, on the key
# tmux uses for `select-layout -E`). herdr has no balance action or CLI command
# for this, so the script drives the layout.set_split_ratio API directly.
[[keys.command]]
key = "prefix+="
type = "shell"
command = "~/.config/herdr/scripts/even-layout.sh"
description = "even out all pane sizes"

# prefix+c: open a new vertical split (40% of width) running Claude Code.
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "~/.config/herdr/scripts/claude-split.sh"
description = "claude in 40% vertical split"

# prefix+shift+c: prompt for a tab name, then open a new tab running Claude Code.
# type = "popup" so the name prompt runs in a herdr-rendered PTY where
# interactive input works (a detached type = "shell" command has no terminal).
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "~/.config/herdr/scripts/claude-tab.sh"
description = "claude in new tab (prompts for name)"
width = "40%"
height = 3

# ctrl+alt+shift+semicolon (ctrl+meta+shift+:): prompt for a shell command in a
# popup, then eval it there. type = "popup" so the prompt runs in a herdr-rendered
# PTY where interactive line editing works, and so command output can stay on
# screen until a keypress. The script evals with HERDR_PANE_ID (the popup)
# unset and cwd set to the invoking pane's, so `herdr-preset
# open-file-with-fallback` splits off the pane you were in, not the popup.
[[keys.command]]
key = "ctrl+alt+shift+semicolon"
type = "popup"
command = "~/.config/herdr/scripts/run-command.sh"
description = "prompt for a command and run it"
width = "60%"
height = "40%"

# Open the live config.toml for editing in a zoomed vertical split. The script
# reloads the config when the editor exits, so no manual prefix+shift+r needed.
# type = "shell" (not "popup"): a full-screen popup is session-modal and eats the
# prefix key while the editor runs. A real pane keeps every prefix binding live,
# and quitting the editor closes the pane.
[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "~/.config/herdr/scripts/edit-config.sh"
description = "edit herdr config"

# Copy the previous command's output to the clipboard (fish panes only).
# Runs as a popup (a herdr-rendered PTY) rather than a detached shell so the
# script's OSC 52 clipboard sequence is intercepted by herdr and forwarded to the
# attached client's machine -- this is what makes it work over `herdr --remote`.
# The popup emits the escape and exits immediately, so it just flickers closed.
[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "~/.config/herdr/scripts/copy-last-output.sh"
description = "copy last command output"
width = 20
height = 1

# prefix+o / prefix+y: interactively pick files, urls, and configured custom ids
# out of the focused pane's recent output. prefix+o opens
# the first pick; when the system URL opener is unavailable, URL picks fall back
# to herdr-preset's OSC 52 relay so they open on the attached client even over
# SSH. prefix+y copies every pick to the clipboard.
# type = "shell": the script captures the pane's screen FIRST (zooming it to
# read it at full width), and only then splits off a zoomed pane to run the
# picker in -- a split resizes and reflows the pane it comes from, so the order
# is what keeps the picker matching the screen you were looking at. That pane is
# a herdr-rendered PTY, which the curses UI needs and which also lets the copy
# variant's OSC 52 reach the attached client over `herdr --remote`. The split
# closes when the picker exits.
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "~/.config/herdr/scripts/pick-selection.sh open"
description = "pick from pane output and open"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "~/.config/herdr/scripts/pick-selection.sh copy"
description = "pick from pane output and copy"

# Copy the focused pane's id to the clipboard and show a notification.
# Runs as a popup (a herdr-rendered PTY) so the script's OSC 52 clipboard
# sequence is forwarded to the attached client -- works over `herdr --remote`.
[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "~/.config/herdr/scripts/copy-pane-id.sh"
description = "copy pane id"
width = 20
height = 1

# prefix+shift+m: break the focused pane out of its split and into a new tab of
# the same workspace (tmux parity: `break-pane`). herdr has no native action for
# this, so the script drives the `pane move` CLI. When the pane is already alone
# in its tab a new tab would be indistinguishable from what you have, so it
# moves to a new workspace instead.
# type = "popup" so the name prompt runs in a herdr-rendered PTY where
# interactive input works (same as claude-tab.sh). The prompt comes prefilled
# with the pane's (or, for the workspace case, the tab's) current name, so it is
# wider than claude-tab.sh's to fit one. Esc cancels without moving.
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = "~/.config/herdr/scripts/break-pane.sh"
description = "move pane to a new tab (new workspace if alone; prompts for name)"
width = "60%"
height = 3

# Copy the focused tab's id to the clipboard and show a notification.
# Popup for the same reason as copy-pane-id.sh: OSC 52 needs a herdr-rendered PTY
# so the copy reaches the attached client over `herdr --remote`.
[[keys.command]]
key = "prefix+ctrl+y"
type = "popup"
command = "~/.config/herdr/scripts/copy-tab-id.sh"
description = "copy tab id"
width = 20
height = 1

# prefix+alt+l: repaint everything (tmux parity: `bind r refresh-client`). For
# the host-surface corruption that ui.redraw_on_focus_gained clears on focus --
# herdr has no redraw action, so the script pokes the client with SIGWINCH,
# which is the one path that forces a full frame. See refresh-screen.sh.
# Not prefix+ctrl+l / ctrl+alt+l: those are pane-nav right (below).
[[keys.command]]
key = "prefix+alt+l"
type = "shell"
command = "~/.config/herdr/scripts/refresh-screen.sh"
description = "refresh/repaint the screen"

# Smart pane navigation: focus the pane in that direction, but forward ctrl+hjkl
# to (n)vim when the pane is zoomed or is the only pane in the tab.
# ctrl+alt+h/j/k/l are the direct (prefix-less) chords forwarded by Ghostty for
# the pane-nav fallback: same command, no prefix-timeout delay.
[[keys.command]]
key = ["prefix+ctrl+h", "ctrl+alt+h"]
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh left h"
description = "focus/forward pane left"

[[keys.command]]
key = ["prefix+ctrl+j", "ctrl+alt+j"]
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh down j"
description = "focus/forward pane down"

[[keys.command]]
key = ["prefix+ctrl+k", "ctrl+alt+k"]
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh up k"
description = "focus/forward pane up"

[[keys.command]]
key = ["prefix+ctrl+l", "ctrl+alt+l"]
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh right l"
description = "focus/forward pane right"

# Smart tab navigation: move to the next/previous tab, but hop to the neighbouring
# workspace (and its first/last tab) when already at the end of the current one.
# ctrl+alt+shift+] / ctrl+alt+shift+[ are the direct chords forwarded by Ghostty
# for cmd+shift+] / cmd+shift+[: same command, no prefix-timeout delay.
[[keys.command]]
key = ["prefix+]", "ctrl+alt+shift+]"]
type = "shell"
command = "~/.config/herdr/scripts/smart-tab-nav.sh next"
description = "next tab (spills into next workspace)"

[[keys.command]]
key = ["prefix+[", "ctrl+alt+shift+["]
type = "shell"
command = "~/.config/herdr/scripts/smart-tab-nav.sh prev"
description = "previous tab (spills into previous workspace)"

# prefix+backspace: forward <c-space><bs> to (n)vim, else close the tab.
# ctrl+alt+w is the direct chord forwarded by Ghostty for cmd+w: same smart
# close, no prefix-timeout delay.
[[keys.command]]
key = ["prefix+backspace", "ctrl+alt+w"]
type = "shell"
command = "~/.config/herdr/scripts/smart-close.sh"
description = "close: forward to nvim or close tab"

# prefix+tab: jump to the next agent that needs attention -- blocked (waiting on
# you) before done (finished work to review), skipping the agent you are already
# in, so repeated presses cycle through the queue. A fish port of the
# herdr-attention plugin (github.com/milkyskies/herdr-attention), kept as a
# script so it needs no plugin install and no node.
# When nothing needs attention it falls through to the forward half of the focus
# jumplist below -- prefix+tab IS ctrl+i, so back/forward land on the same pair
# of keys vim uses.
[[keys.command]]
key = "prefix+tab"
type = "shell"
command = "~/.config/herdr/scripts/attention-jump.fish"
description = "next agent needing attention (else forward in focus history)"

# prefix+shift+tab / prefix+ctrl+o: go back to the terminal focused before this
# one; repeat to keep walking back. herdr has no last-pane API, so the trail is
# recorded by focus-history-daemon.fish, which these bindings start on demand
# (it subscribes to pane.focused on the API socket and appends to
# ~/.local/state/herdr/focus-history/journal).
[[keys.command]]
key = ["prefix+shift+tab", "prefix+ctrl+o"]
type = "shell"
command = "~/.config/herdr/scripts/focus-jumplist.fish back"
description = "back to previous terminal (repeat: further back)"

# prefix+ctrl+i: forward only, never the attention jump. Whether this is its own
# key depends on the outer terminal: ctrl+i and tab are the same byte (0x09)
# unless the terminal speaks the kitty keyboard protocol's disambiguation mode
# (Ghostty does). Where they are indistinguishable this entry is simply dead and
# prefix+ctrl+i keeps doing what prefix+tab does, which is the same thing minus
# the attention jump.
[[keys.command]]
key = "prefix+ctrl+i"
type = "shell"
command = "~/.config/herdr/scripts/focus-jumplist.fish forward"
description = "forward in focus history"

# Agent inbox (scripts/agent-inbox-daemon.py + agent-inbox.fish + agent-inbox-tui.py).
# A no-plugin port of github.com/douglascorrea/herdr-agent-inbox: the Agents
# panel becomes an attention queue you can triage like a mailbox. Settling an
# agent sinks it to the bottom until it does something again; marking one unread
# pins it back on top. The daemon starts on demand from these keys, the same way
# focus-history-daemon.fish does.
#
# prefix+m: settle the focused agent -- "I am done with this thread".
[[keys.command]]
key = "prefix+m"
type = "shell"
command = "~/.config/herdr/scripts/agent-inbox.fish settle"
description = "settle agent (sink to bottom of the inbox)"

# prefix+u: the opposite -- push a finished agent back into the attention tier.
# NOT prefix+shift+m (upstream's key): that is break-pane.sh here.
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "~/.config/herdr/scripts/agent-inbox.fish unread"
description = "mark agent unread (back to the attention tier)"

# prefix+alt+m: settle everything finished in this workspace at once.
[[keys.command]]
key = "prefix+alt+m"
type = "shell"
command = "~/.config/herdr/scripts/agent-inbox.fish settle-workspace"
description = "settle every finished agent in the workspace"

# prefix+i: the inbox popup -- every agent and every closed chat, with titles,
# runtimes and the triage keys (s settle, u unread, S settle-all, r retitle,
# g cycle views, h history, enter focus).
# type = "popup" so it runs in a herdr-rendered PTY: it is a curses app, and a
# detached type = "shell" command has no terminal at all. Session-modal (it eats
# the prefix key while open), which is what a modal picker wants anyway.
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "python3 ~/.config/herdr/scripts/agent-inbox-tui.py"
description = "agent inbox"
width = "80%"
height = "70%"

# prefix++ / prefix+_: widen / narrow the sidebar by 2 columns. herdr has no
# keybinding for this (only the mouse drag on the divider), and the live width
# is session state that config cannot move directly -- see sidebar-resize.py for
# the min/max-clamp trick it uses, and note that it REWRITES the three
# sidebar_*width lines in [ui] above on every press.
# These are the shift-variants of prefix+= (even-layout) and prefix+minus
# (split_horizontal); herdr matches the shifted codepoint, so all four are
# distinct bindings.
# "plus", not "+": the parser splits combos on "+", so "prefix++" is rejected
# as an empty key name (reload-config says so). "_" needs no such spelling.
[[keys.command]]
key = "prefix+plus"
type = "shell"
command = "python3 ~/.config/herdr/scripts/sidebar-resize.py +2"
description = "sidebar wider"

[[keys.command]]
key = "prefix+_"
type = "shell"
command = "python3 ~/.config/herdr/scripts/sidebar-resize.py -2"
description = "sidebar narrower"

# Legacy indexed shortcut config is still parsed for compatibility.
# Prefer switch_tab, switch_workspace, and focus_agent for new configs.
# [keys.indexed]
# tabs = ""       # e.g. "ctrl" makes ctrl+1..9 switch tabs directly
# workspaces = "" # e.g. "ctrl+shift" makes ctrl+shift+1..9 switch workspaces directly
# agents = ""     # e.g. "alt" makes alt+1..9 focus agent rows directly

# Size of the virtual terminal used when no client is attached.
# Attached clients always use their own terminal size.
# [server]
# headless_cols = 120
# headless_rows = 40

# [worktrees]
# directory = "~/.herdr/worktrees"

[ui]
# Sidebar width (auto-scaled based on workspace names, this sets the default).
# All three width keys below are UNCOMMENTED on purpose: prefix++ / prefix+_
# (scripts/sidebar-resize.py) rewrite these very lines in place, and the script
# refuses to append keys it cannot find -- appending would risk a second
# definition in the wrong section.
sidebar_width = 33

# Minimum sidebar width when expanded (columns)
sidebar_min_width = 18

# Maximum sidebar width when expanded (columns)
sidebar_max_width = 60

# Start with the sidebar collapsed. Changes take effect on the next launch.
# sidebar_start_collapsed = false

# Collapsed sidebar presentation: "compact" keeps the narrow status rail, "hidden" uses zero width.
# sidebar_collapsed_mode = "compact"

# Terminal width at or below which Herdr uses the mobile single-column layout.
# Increase this for foldables, tablets, or wide phone terminals.
# mobile_width_threshold = 64

# Capture mouse input for Herdr's mouse UI.
# Set false to let the terminal handle normal clicks, such as Cmd-clicking URLs.
# Pane apps like lazygit and btop can still receive mouse when they request it.
# tmux parity: `set -g mouse on`
mouse_capture = true

# Automatically copy text selected with the mouse.
# Set false to retain drag or double-click word selection until Ctrl+C,
# or Cmd+C when the host forwards it, copies and clears it.
# tmux parity: copy-mode-vi `copy-pipe "pbcopy"` on selection
copy_on_select = true

# Host cursor policy: "auto", "native", or "drawn".
# "auto" draws Herdr's own cursor on native Windows builds and WSL to avoid ConPTY cursor flicker, and uses the native terminal cursor elsewhere.
# "native" always uses the outer terminal cursor. "drawn" always draws Herdr's cursor as terminal cell content.
# host_cursor = "auto"

# Optional modifier that forwards right-click hold/drag gestures to pane apps instead of opening Herdr's pane menu.
# Empty/off disables this. Shift is intentionally unsupported because terminals commonly reserve Shift+mouse.
right_click_passthrough_modifier = "ctrl"

# Force a full redraw when the outer terminal regains focus.
# Set false to reduce visible flashing when switching back to Herdr.
# Trade-off: rare host terminal surface corruption may persist until the next full redraw.
# redraw_on_focus_gained = true

# Pane scrollback lines to scroll per mouse wheel notch.
# mouse_scroll_lines = 3

# Ask for confirmation before closing a workspace
# confirm_close = true

# Ask for a tab name before creating a new tab.
# Set false to create tabs immediately with generated names.
prompt_new_tab_name = true

# Ask for a workspace name before interactive creation.
prompt_new_workspace_name = false

# Draw borders around split panes.
pane_borders = true

# Draw borders along the outside edge of the pane area.
# Disable for tmux-style internal splitters without an outside frame.
# pane_outer_borders = true

# Draw interactive scrollbars beside terminal panes.
# Set false to reclaim the scrollbar column and keep it out of terminal-native selections.
# pane_scrollbars = true

# Keep split panes visually separated instead of sharing divider borders.
# pane_gaps = true

# Show detected/reported agent labels in split pane borders when no manual pane name is set.
# show_agent_labels_on_pane_borders = false

# Hide the tab row when a workspace has exactly one tab.
# New tabs can still be created with the configured keybinding.
hide_tab_bar_when_single_tab = false

# Desktop tab row placement: "top" or "bottom".
# tab_bar_position = "top"

# Ordered status entries at the right edge of the desktop tab bar.
# Supported types: zoom, hostname, datetime, text, and command.
# Hostname, datetime, and command entries resolve on the Herdr server.
# tab_bar_right = []
# tab_bar_right_separator = " "

# Title Herdr writes to the terminal it runs in, which is what window managers
# show in title, tab, and group bars. Tokens are {hostname}, {workspace}, {tab},
# {pane}, and {terminal_title}; {{ and }} are literal braces.
# The title renders on the Herdr server, so {hostname} names the host the panes
# run on even when attaching from a remote client.
# Set to "" to leave the outer terminal title alone.
# Prefixed with [herdr] so window/tab lists (and Hammerspoon window matching)
# can always tell a herdr window apart from a plain terminal.
window_title = "[herdr] {hostname}: {workspace}"

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
# "workspaces" is accepted as an alias for "spaces".
# agent_panel_sort = "spaces"

# Agent status indicators: "dots" preserves the compact color marks; "symbols" uses
# distinct static glyphs for blocked, working, done, idle, and unknown states.
# status_indicators = "dots"

# Expanded agent rows. Built-ins are state_icon, state_text, workspace, tab, pane, agent,
# terminal_title, and terminal_title_stripped.
# Custom values reported through pane metadata use a $name token.
# A token occurrence may be styled with { token = "workspace", fg = "#89b4fa", bold = true, dim = false }.
# Omitted style fields preserve the contextual default.
# [ui.sidebar.agents]
# Blank rows between agent entries. Set to 1 to restore the previous spacing.
# row_gap = 0
# rows = [["state_icon", "workspace", "tab"], ["agent"]]
# Optional canonical agent IDs replace the default rows for matching agents.
# [ui.sidebar.agents.rows_by_agent]
# claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
# Superseded while the agent-inbox daemon runs: it calls agent.view.set with a
# sort over its own `rank` token (blocked, then finished-unseen, working, idle,
# and settled at the bottom), which is this same attention queue plus a settled
# tier. This value is what the panel falls back to when the daemon is not up.
agent_panel_sort = "priority"

[ui.sidebar.agents]
# First line:  <state_icon> <workspace> <tab>
# Second line: <flag> <terminal title> <age>
# herdr joins row tokens with a space (sidebar rows can't contain literal text,
# only builtin tokens and `$name` metadata tokens).
#
# $title is herdr's own terminal_title_stripped first -- exactly what this row
# showed before the agent inbox went in ("π - src") -- then, only for agents
# herdr has no title for, the name the AGENT ITSELF gave the session: codex's
# thread title from its own db, claude's generated name, a pi session you
# named. codex sets no terminal title at all, so that fallback is the
# difference between its own title and an empty row.
# What it never uses is a title of the daemon's own invention scraped from the
# transcript -- that is just the first prompt copied out (daemon CONFIG:
# prefer_terminal_title = true, prompt_titles = false). With
# prefer_terminal_title on it also stops overriding herdr's pane title.
#
# $flag and $age are the parts worth having, and they come from the daemon:
# $flag is ⚑ settled / ● unread, $age is how long the session has been alive.
# Both simply render empty while the daemon is not running -- any inbox key
# starts it -- so this row degrades to the plain title it always was.
rows = [
    ["state_icon", "workspace", "tab"],
    [{ token = "$flag", fg = "#e5c890", bold = true }, "$title", { token = "$age", dim = true }]
]

[ui.sidebar.spaces]
# Per-workspace rollup from the same daemon: $agents counts its agents by state
# ("!1 ●2 ▸1 ⚑3"), $busy is the longest stint an agent there has been working.
rows = [
    ["state_icon", "workspace", "$agents", { token = "$busy", dim = true }],
    ["branch", "git_status"]
]

# Expanded space rows. Built-ins are state_icon, state_text, workspace, branch, and git_status.
# Custom values reported through workspace metadata use a $name token, for example $jj_status.
# Inline token styles accept strict #RGB/#RRGGBB foregrounds plus bold and dim booleans.
# [ui.sidebar.spaces]
# Blank rows between space entries. Set to 1 to restore the previous spacing.
# row_gap = 0
# rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# Accent color for highlights, borders, and navigation UI.
# Accepts: hex (#89b4fa), named colors (cyan, blue, magenta), or rgb(r,g,b)
# accent = "cyan"

# Background notification popup delivery
[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
delivery = "terminal"
delay_seconds = 3

[ui.toast.herdr]
# position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

# Play sounds when agents change state in background workspaces
[ui.sound]
# enabled = true
# Optional custom mp3 sound files. Relative paths are resolved from this config file's directory.
# path = "sounds/notification.mp3"   # one mp3 file for all sound notifications
# done_path = "sounds/done.mp3"      # overrides only finished notifications
# request_path = "sounds/request.mp3" # overrides only needs-attention notifications

# Per-agent overrides: default | on | off
# By default, droid is muted.
# [ui.sound.agents]
# droid = "off"

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Herdr server restart. Requires official integrations that report session refs.
# When an agent does NOT come back this way (it exits on start, or its launcher
# needs something this machine no longer provides), prefix+ctrl+r puts the pane
# back into its conversation from the agent-sessions store -- see the
# agent-sessions plugin and `herdr-preset resume-agent`, which key their records
# by where the pane sits precisely because pane ids do not survive a restart.
# closest analog to tmux-resurrect/tmux-continuum session restore
resume_agents_on_restore = true

[remote]
# Whether herdr manages the ssh config used for `herdr --remote`.
# When true (default), herdr runs remote ssh through a generated config that
# includes your ~/.ssh/config first and adds ServerAliveInterval/
# ServerAliveCountMax as fallbacks (so any keepalive values you set yourself
# still win) to survive idle network/NAT timeouts. Herdr also uses a private
# per-attach OpenSSH control socket to reuse the first authenticated connection.
# Set false to run plain ssh against your ssh config unchanged — this does not
# force keepalive or multiplexing off, it only stops herdr from adding its own.
manage_ssh_config = false

[experimental]
# Allow launching herdr from inside a herdr-managed pane.
# allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true
# Save recent pane screen history across full server restarts.
# tmux parity: `@resurrect-capture-pane-contents 'on'`
pane_history = true
# While prefix mode is active, temporarily switch the host input source to
# an ASCII-capable mode so prefix commands register even when an IME is
# active, then restore the previous input source when prefix mode exits. On
# macOS this selects the ASCII-capable keyboard layout; on Windows it toggles
# a Korean IME between Hangul and English (other IME languages are left
# unchanged). macOS and Windows only; best-effort. Default: false.
# switch_ascii_input_source_in_prefix = false
# Expose the focused pane's cursor to the outer terminal so macOS input
# methods keep tracking the candidate window when TUIs paint their own
# cursor (Claude Code, pi, codex). Trade-off: extra cursor visible for
# apps that hide it without painting a replacement (vim normal mode, etc.).
# reveal_hidden_cursor_for_cjk_ime = false
# Optional allow-list: only reveal for focused panes whose detected agent
# matches one of these names. Empty means apply to any focused pane.
# If the list contains no valid names, the reveal does not apply.
# Accepted: pi, claude, codex, gemini, cursor, devin, cline, opencode,
# copilot, kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qoder, qwen,
# qwen-code, maki.
# cjk_ime_agents = []
# Cursor shape rendered when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block (default), underline, steady_underline, bar, steady_bar.
# cjk_ime_cursor_shape = "steady_block"

[advanced]
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Matches Ghostty's default scrollback-limit behavior.
# scrollback_limit_bytes = 10000000
