#:schema https://raw.githubusercontent.com/y3owk1n/neru/v1.63.0/schemas/config.schema.json
# Active configuration for v1.63.0. Hammerspoon owns launchers and continuous clicks.
# Hammerspoon owns global launchers. Mode-local keys stay here.

[general]
passthrough_unbounded_keys = true
should_exit_after_passthrough = false

[hotkeys]

[sticky_modifiers]
enabled = false

# Mouseless palette in both system appearances; alpha is set by each UI.
[theme.light]
surface = "#7A4949"
accent = "#B87671"
accent_alt = "#FF8A00"
on_accent_alt = "#FEFEFE"
text = "#FEFEFE"

[theme.dark]
surface = "#7A4949"
accent = "#B87671"
accent_alt = "#FF8A00"
on_accent_alt = "#FEFEFE"
text = "#FEFEFE"

[macros]
# Neru performs the click. Hammerspoon only closes the mode when continuous
# clicks are off. Keeping this decision there avoids rewriting hotkeys.
after_click = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').afterClick()\""
after_click_stay = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').afterClick('stay')\""
after_click_exit = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').afterClick('exit')\""
# Enter-family clicks exit the mode; Space-family clicks reset and stay.
confirm_left = ["action left_click --bail-on-error", "macro after_click_exit"]
confirm_left_stay = ["action left_click --bail-on-error", "macro after_click_stay"]
confirm_right = ["action right_click --bail-on-error", "macro after_click_exit"]
confirm_right_stay = ["action right_click --bail-on-error", "macro after_click_stay"]
confirm_middle = ["action middle_click --bail-on-error", "macro after_click_exit"]
confirm_middle_stay = ["action middle_click --bail-on-error", "macro after_click_stay"]
confirm_move = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').moveOnly()\""
confirm_move_exit = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').moveOnly(true)\""
confirm_move_bare = ["action move_mouse --bare --bail-on-error", "macro after_click_stay"]
confirm_move_bare_exit = ["action move_mouse --bare --bail-on-error", "macro after_click_exit"]
opacity_down = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').adjustOpacity(-0.05)\""
opacity_up = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').adjustOpacity(0.05)\""
open_recursive = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').openRecursive()\""
open_grid = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').openGrid()\""
# Commit the virtual selection before pressing OR releasing a drag button.
toggle_drag = ["action move_mouse --selection --bail-on-error", "action left_click --toggle"]
start_hold = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').startHold()\""
toggle_continuous = "exec /opt/homebrew/bin/hs -c \"require('neruNavigation').toggleContinuous()\""

[hints]
strategy = "axtree"
include_menubar_hints = true
include_dock_hints = true

[hints.ui]
placement = "top"
# Homebrew's variable font registers this named Bold instance in CoreText.
font_family = "AtkinsonHyperlegibleMono-ExtraLight_Bold"
font_size = 12
# Neru exposes no text-shadow setting. Dark badges provide the contrast.
background_color = "#E67A4949"
text_color = "#FFFEFEFE"
matched_text_color = "#FFFF8A00"
border_color = "#C0B87671"
border_width = 1

[hints.search_input_ui]
font_family = "AtkinsonHyperlegibleMono-ExtraLight_Bold"
font_size = 12

[hints.hotkeys]
"F16" = "macro open_grid"
"Cmd+F16" = "macro toggle_continuous"
# Hints belong to the focused window, so swapping display moves the cursor
# there and leaves Hints; reopen Hints on that display's focused window.
"Tab" = ["action move_monitor --bail-on-error", "idle"]
"Shift+Tab" = ["action move_monitor --previous --bail-on-error", "idle"]
"Space" = "macro confirm_left_stay"
"Enter" = "macro confirm_left"
"Shift+Space" = "macro confirm_move_bare"
"Shift+Enter" = "macro confirm_move_bare_exit"
"Shift+L" = "__disabled__"
"/" = "action search_hints --confirm-on-label"
"Alt+Space" = "macro confirm_right_stay"
"Alt+Enter" = "macro confirm_right"
"Ctrl+Space" = "macro confirm_middle"
"Ctrl+Enter" = "macro confirm_middle"
"Cmd+Space" = "macro confirm_middle_stay"
"Cmd+Enter" = "macro confirm_middle"
"Ctrl+Alt+Enter" = "action left_click --toggle"

# Hold the modifier while completing a hint label to choose its mouse button.
[hints.select_with]
alt = "action right_click"
cmd = "action middle_click"
ctrl = "action middle_click"
shift = "action move_mouse"

# Cmd+Right Shift uses a 5x3 grid, alternating left/right QWERTY key sets.
# The Grid palette entry swaps only the marked block to Mouseless's layout.
[recursive_grid]
capture_scope = "screen"
min_size_width = 1
min_size_height = 1
# BEGIN NERU MANAGED LAYOUT
grid_cols = 5
grid_rows = 3
keys = "qwertasdfgzxcvb"
max_depth = 10
layers = [
  { depth = 1, grid_cols = 5, grid_rows = 3, keys = "yuiophjkl;nm,./" },
  { depth = 3, grid_cols = 5, grid_rows = 3, keys = "yuiophjkl;nm,./" },
  { depth = 5, grid_cols = 5, grid_rows = 3, keys = "yuiophjkl;nm,./" },
  { depth = 7, grid_cols = 5, grid_rows = 3, keys = "yuiophjkl;nm,./" },
  { depth = 9, grid_cols = 5, grid_rows = 3, keys = "yuiophjkl;nm,./" },
]
# END NERU MANAGED LAYOUT

[recursive_grid.animation]
enabled = false

[recursive_grid.ui]
font_family = "AtkinsonHyperlegibleMono-ExtraLight_Bold"
font_size = 12
# Mouseless palette, in Neru's alpha-first #AARRGGBB format.
# Recursive Grid uses one shared cell fill; this is a darker red variant.
highlight_color = "#8C180C10"      # near-black burgundy, 50% opacity
text_color = "#FFFEFEFE"           # nearly-white labels
# Current level only; next-level previews are disabled.
sub_key_preview = false
sub_key_preview_font_size = 10
sub_key_preview_text_color = "#FFFFFFFF"
line_color = "#8CB87671"           # separators at 50% opacity, matching the background
line_width = 2
label_background = true
label_background_color = "#D9000000" # black shadow-like contrast behind labels
label_background_padding_x = 4
label_background_padding_y = 2
label_background_border_radius = 3
label_background_border_width = 0

[recursive_grid.hotkeys]
"F16" = "idle"
"-" = "macro opacity_down"
"=" = "macro opacity_up"
"Cmd+F16" = "macro toggle_continuous"
"Escape" = "action reset"
"Shift+Escape" = "idle"
# Aim with a virtual selection. Dragging temporarily enables real-pointer follow.
"`" = "__disabled__"
# Aim without clicking, then confirm. Hyper+Shift+/ toggles continuous clicks.
"Space" = "macro confirm_left_stay"
"Enter" = "macro confirm_left"
"Shift+Space" = "macro confirm_move"
"Shift+Enter" = "macro confirm_move_exit"
"Alt+Space" = "macro confirm_right_stay"
"Alt+Enter" = "macro confirm_right"
"Ctrl+Space" = "macro start_hold"
"Ctrl+Enter" = "macro start_hold"
"Cmd+Space" = "macro confirm_middle_stay"
"Cmd+Enter" = "macro confirm_middle"
"Ctrl+Backspace" = "action reset"
"Alt+Backspace" = "action backspace"
"Ctrl+Shift+Backspace" = "action backspace"
"Ctrl+Shift+Escape" = "action backspace"
"Tab" = "action move_monitor"
"Shift+Tab" = "action move_monitor --previous"
# Keep Option/Cmd/Ctrl+Enter for clicks; use this for explicit drag toggling.
"Ctrl+Alt+Enter" = "macro toggle_drag"
# Shift-held aiming and Shift+Ctrl dragging must still select grid cells.
"Shift+A" = "action feed --mode a"
"Shift+B" = "action feed --mode b"
"Shift+C" = "action feed --mode c"
"Shift+D" = "action feed --mode d"
"Shift+E" = "action feed --mode e"
"Shift+F" = "action feed --mode f"
