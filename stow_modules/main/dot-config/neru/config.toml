# Three-character addresses: left-hand prefix, right-hand column, left-hand row.
# Continue alternating with right-hand keys in the final 3x3 subgrid.
[grid]
characters = "wertasdfgzxcvb"
row_labels = "wertasdfgzxcvb"
col_labels = "yuiophjklnm"
sublayer_keys = "uiojklm,."
max_label_length = 3

[grid.hotkeys]
"F16" = "idle"
"-" = "macro opacity_down"
"=" = "macro opacity_up"
"Escape" = "action reset"
"Cmd+F16" = "macro toggle_continuous"
"`" = "__disabled__"
"Space" = "macro confirm_left_stay"
"Enter" = "macro confirm_left"
"Shift+Space" = "macro confirm_move"
"Shift+Enter" = "macro confirm_move_exit"
"Alt+Space" = "macro confirm_right_stay"
"Alt+Enter" = "macro confirm_right"
"Ctrl+Space" = "macro start_hold"
"Ctrl+Enter" = "macro start_hold"
"Cmd+Space" = "macro confirm_middle_stay"
"Cmd+Enter" = "macro confirm_middle"
"Ctrl+Alt+Enter" = "macro toggle_drag"
"Ctrl+Backspace" = "action reset"
"Ctrl+Shift+Backspace" = "action backspace"
"Ctrl+Shift+Escape" = "action backspace"
"Shift+Escape" = "idle"
"Tab" = "action move_monitor"
# Allow row/column/subgrid selection while the Ctrl+Shift drag chord is held.
"Ctrl+Shift+A" = "action feed --mode a"
"Ctrl+Shift+B" = "action feed --mode b"
