[vim.ui]
font_family = "AtkinsonHyperlegibleMono-ExtraLight_Bold"
cursor_color = "#B3FF8A00"
selection_color = "#4DB87671"
match_color = "#B3FF8A00"
container_color = "#997A4949"
status_background_color = "#E67A4949"
status_text_color = "#FFFEFEFE"

[vim.hotkeys]
"F16" = "macro open_grid"
"Cmd+F16" = "macro toggle_continuous"
"Tab" = ["action move_monitor --bail-on-error", "vim --capture-scope screen"]
"Shift+Tab" = ["action move_monitor --previous --bail-on-error", "vim --capture-scope screen"]
"Shift+Space" = "action feed --mode g h"
"Shift+Enter" = ["action feed --mode g h", "idle"]
# Feed Vim's own click mappings so these target its text cursor, not a stale
# system pointer. Space stays in Vim; Enter variants click then leave.
"Alt+Space" = "action feed --mode g r"
"Alt+Enter" = ["action feed --mode g r", "idle"]
"Ctrl+Space" = "macro start_hold"
"Ctrl+Enter" = "macro start_hold"
"Cmd+Space" = "action feed --mode g m"
"Cmd+Enter" = ["action feed --mode g m", "idle"]

# Preserve Vim's own character targeting and visual-mode Return (drag/select).
# Normal Return clicks then :q; Space clicks and rereads without leaving Vim.
[vim.keymaps.normal]
"<CR>" = "<Plug>(left-click):q<CR>"
"<Space>" = "<Plug>(left-click)"

[vim.keymaps.visual]
"<Space>" = "<Plug>(left-click)"
"gr" = "<Plug>(right-click)"
"gm" = "<Plug>(middle-click)"
"gh" = "<Plug>(move-mouse)"

