[grid.ui]
font_family = "AtkinsonHyperlegibleMono-ExtraLight_Bold"
font_size = 12
# Standard Grid supports separate base and selected-cell fills.
background_color = "#8C180C10"
matched_background_color = "#8C180C10" # same fill as Recursive Grid
text_color = "#FFFEFEFE"
matched_text_color = "#FFFEFEFE"
border_color = "#00B87671"
matched_border_color = "#00FF8A00"
